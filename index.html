<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML and JavaScript Text Box</title>
</head>
<body>
<style>
    input[type="text"] {
        width: 950px;
        height: 100px;
    }
</style>
<style>
    .premier {
        margin-top: 50px;
        font-size: 30px;
        background-color: #041375;
        color: white;
        text-align: center;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
    .electionDate {
        margin-top: 50px;
        font-size: 20px;
        background-color: #ffffff;
        color: rgb(0, 0, 0);
        text-align: center;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
    .form-label {
        margin-top: 50px;
        font-size: 20px;
        display: block;
        text-align: center;
        margin-left: auto;
        margin-right: auto;
    }
    .voteingLink {
        margin-top: 4px;
        font-size: 20px;
        display: block;
        text-align: center;
        margin-left: auto;
        margin-right: auto;
    }
    .constitution {
        margin-top: 50px;
        margin-left: 10px;
        display: block;
        text-align: center;
    }
</style>
    <!-- 1. Added the label, the input text box, and the missing 'id' attributes -->
    <input type="text" class=premier id="currentPremier" name="Current GroupChatVille Premier:" value="Press Space For Your GroupChatVille Premier" size="50" readonly>
    <script src="java.js" defer></script>
    <textarea rows="7" cols="50" class=electionDate id="electionDate" name="Election Date:" value="" size="50" readonly></textarea>
    <script src="java.js" defer></script>
    <label class="form-label" id="votingLink" for="votingLink">Voting Link:</label>
    <a class="voteingLink" href="https://docs.google.com/forms/d/e/1FAIpQLSddGbeJ_zOD3Yp4nkb1cGWSaRHHdQwLlK1mSmIszemt1BWPHQ/viewform?usp=dialog" target="_blank">Click here to vote!</a>
    <a class="constitution" href="https://docs.google.com/document/d/1-7Q2mUOLOxO46DfudBvFT3fSORM6Gv16pfxHCDhUWBY/edit?usp=sharing" target="_blank" style="font-size:25px;">The Constitution of GroupChatVille</a>
</body>
</html>
