<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML and JavaScript Text Box</title>
    <meta name="viewport" content="width=1200">
</head>
<body>
<style>
    input[type="text"] {
        width: 950px;
        height: 100px;
    }
</style>
<style>
    .premier {
        margin-top: 50px;
        font-size: 30px;
        background-color: #041375;
        color: white;
        text-align: center;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
    .electionDate {
        margin-top: 50px;
        font-size: 20px;
        background-color: #ffffff;
        color: rgb(0, 0, 0);
        text-align: center;
        display: block;
        margin-left: 200px;
    }
    .form-label {
        margin-top: -200px;
        font-size: 25px;
        display: block;
        text-align: center;
        margin-left: 550px;
    }
    .voteingLink {
        margin-top: 4px;
        font-size: 25px;
        display: block;
        text-align: center;
        margin-left: 550px;
    }
    .constitution {
        margin-top: 50px;
        margin-left: 550px;
        display: block;
        text-align: center;
    }
    .da_rat {
        margin-top: 2000px;
        display: block;
        margin-left:auto;
        margin-right:auto;
   }
    .da_rat2 {
        margin-top: 5000px;
        display: block;
        margin-left:auto;
        margin-right:auto;
        width: 300px;
   }
    body {
      margin: 0;
      background-color: #ee0a0a;
    }
    .desktop-wrapper {
      width: 1200px; 
      margin: 0 auto;
    }
    .premierImage {
        width: 1200px;
        height: auto;
        position: absolute;
        z-index: 10;
    }
    .ratdance {
        width: 200px;
        height: 400px;
        position: absolute;
        z-index: 11;
        margin-left: 100px;
        object-fit: cover;
        object-position: center;
        overflow: hidden;
        transform:rotate(15deg);
        margin-top: 100px;
    }
    .ratdance2 {
        width: 200px;
        height: 400px;
        position: absolute;
        z-index: 11;
        margin-left: 900px;
        object-fit: cover;
        object-position: center;
        overflow: hidden;
        transform:rotate(-20deg);
        margin-top: 250px;
    }
    .ratdance3 {
        width: 200px;
        height: 400px;
        position: absolute;
        z-index: 11;
        margin-left: 300px;
        object-fit: cover;
        object-position: center;
        overflow: hidden;
        margin-top: 600px;
    }
</style>
    <div class="desktop-wrapper">
    <input type="text" class=premier id="currentPremier" name="Current GroupChatVille Premier:" value="Press Space For Your GroupChatVille Premier (Or Click)" size="50" readonly>
    <img src="Kroger.jpeg" class="premierImage" id="premierImage">
    <video src="rat dance.mp4" class="ratdance" id="ratdance" muted loop playsinline></video>
    <video src="rat dance.mp4" class="ratdance2" id="ratdance2" muted loop playsinline></video>
    <video src="rat dance.mp4" class="ratdance3" id="ratdance3" muted loop playsinline></video>
    <textarea rows="11" cols="30" class=electionDate id="electionDate" name="Election Date:" value="" size="50" readonly></textarea>
    <script src="java.js" defer></script>
    <label class="form-label" id="votingLink" for="votingLink">Voting Link:</label>
    <a class="voteingLink" href="https://docs.google.com/forms/d/e/1FAIpQLSddGbeJ_zOD3Yp4nkb1cGWSaRHHdQwLlK1mSmIszemt1BWPHQ/viewform?usp=dialog" target="_blank">Click here to vote!</a>
    <a class="constitution" href="https://docs.google.com/document/d/1-7Q2mUOLOxO46DfudBvFT3fSORM6Gv16pfxHCDhUWBY/edit?usp=sharing" target="_blank" style="font-size:25px;">The Constitution of GroupChatVille</a>
    <img src="rat.png" class="da_rat">
    <img src="rat.png" class="da_rat2">
</body>
</html>
